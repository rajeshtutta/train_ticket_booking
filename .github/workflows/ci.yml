name: Java Maven CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Verify Java
      - name: Verify Java
        run: java -version

      # Verify Maven
      - name: Verify Maven
        run: mvn -version

      # Compile
      - name: Compile Project
        run: mvn clean compile

      # Unit Tests
      - name: Run Unit Tests
        run: mvn test

      # Package WAR
      - name: Package WAR
        run: mvn package

      # SonarQube Analysis
      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=Train-Ticket-Booking \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # Trivy Filesystem Scan
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/train_ticket_booking:latest .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/train_ticket_booking:latest

      # Upload WAR Artifact
      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainBook-WAR
          path: target/*.war

      # Deploy to EC2
      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/train_ticket_booking:latest

            docker stop train-ticket-app || true

            docker rm train-ticket-app || true

            docker image prune -f

            docker run -d \
              --name train-ticket-app \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/train_ticket_booking:latest

            docker ps